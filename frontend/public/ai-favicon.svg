<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield Shape -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#sparkleGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- AI Brain / Sparkle Star Central Symbol -->
  <!-- Main 4-point AI Star -->
  <path d="M32 12 C32 23 23 32 12 32 C23 32 32 41 32 52 C32 41 41 32 52 32 C41 32 32 23 32 12 Z" fill="url(#sparkleGrad)" filter="url(#glow)"/>

  <!-- Secondary mini AI Sparkle at Top Right -->
  <path d="M47 15 C47 18 45 20 42 20 C45 20 47 22 47 25 C47 22 49 20 52 20 C49 20 47 18 47 15 Z" fill="#38bdf8"/>

  <!-- Secondary mini AI Sparkle at Bottom Left -->
  <path d="M17 43 C17 45.5 15.5 47 13 47 C15.5 47 17 48.5 17 51 C17 48.5 18.5 47 21 47 C18.5 47 17 45.5 17 43 Z" fill="#c084fc"/>

  <!-- Core Glowing Dot in Center -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" filter="url(#glow)"/>
</svg>
